name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays: catches new cachetools/numpy/pandas releases (the dependency jobs don't use uv.lock)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no major-version tags are published
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked mypy # the typing tests (see [tool.mypy] in pyproject.toml)

  tests:
    # Locked dependencies (uv.lock) on every supported Python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include: # one job each on macOS and Windows (version differences are covered on Ubuntu)
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no major-version tags are published
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest

  dependency-bounds:
    # The oldest and newest dependency versions users can get, outside the lock file, and none of the extras
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python-version: "3.11"
            pins: --with cachetools==8.0.0 --with numpy==1.23.2 --with pandas==1.5.0
          - name: latest
            python-version: "3.15"
            pins: --refresh --with cachetools --with numpy --with pandas
          - name: no extras # without numpy and pandas: tests needing them skip
            python-version: "3.14"
            pins: ""
    name: dependencies (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no major-version tags are published
      - run: uvx --python ${{ matrix.python-version }} --with-editable . ${{ matrix.pins }} pytest
