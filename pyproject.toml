[project]
name = "mcrotk-cache-utils"
version = "0.1.0"
description = "Caching decorators for Python methods and functions: a cache per instance, easy omission or passthrough of arguments such as RNGs, safe copying."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael C. Rotkowitz", email = "mcrotk@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["cache", "caching", "memoization", "decorator", "cachetools", "numpy", "random number generator", "dataclass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cachetools>=8",
]

[project.urls]
Homepage = "https://github.com/mcrotk/mcrotk_cache_utils"
Documentation = "https://github.com/mcrotk/mcrotk_cache_utils/blob/main/docs/guide.md"
Changelog = "https://github.com/mcrotk/mcrotk_cache_utils/releases"
Issues = "https://github.com/mcrotk/mcrotk_cache_utils/issues"

[project.optional-dependencies]
numpy = [
    # first numpy release with Python 3.11 wheels (default_rng itself dates from 1.17)
    "numpy>=1.23.2",
]
pandas = [
    # first pandas release with Python 3.11 wheels
    "pandas>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy",
    "numpy",
    "pandas",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
# Only the typing tests: they check what users' code sees (follow_imports=silent keeps mypy's
# findings in the library's own source out of the report; pyright checks that).
files = ["tests/test_typing.py"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
follow_imports = "silent"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
