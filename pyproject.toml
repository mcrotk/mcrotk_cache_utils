[project]
name = "mcrotk-cache-utils"
version = "0.1.0"
description = "Per-instance method caching built on cachetools, with argument omission, pass-through and key converters (e.g. for RNG-threading functions)."
readme = "README.md"
authors = [
    { name = "Michael Rotkowitz", email = "mcrotk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cachetools>=8",
]

[project.optional-dependencies]
numpy = [
    # first numpy release with Python 3.11 wheels (default_rng itself dates from 1.17)
    "numpy>=1.23.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
